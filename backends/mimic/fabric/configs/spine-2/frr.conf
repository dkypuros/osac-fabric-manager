frr version 10.3
frr defaults datacenter
hostname spine-2
no ipv6 forwarding
service integrated-vtysh-config
!
interface lo
 ip address 192.168.255.12/32
exit
!
interface eth1
 ip address 192.168.254.5/31
exit
!
interface eth2
 ip address 192.168.254.10/31
exit
!
interface eth3
 ip address 192.168.254.12/31
exit
!
router bgp 65200
 bgp router-id 192.168.255.12
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 neighbor FABRIC peer-group
 neighbor FABRIC remote-as external
 neighbor 192.168.254.4 peer-group FABRIC
 neighbor 192.168.254.11 peer-group FABRIC
 neighbor 192.168.254.13 peer-group FABRIC
 !
 address-family ipv4 unicast
  network 192.168.255.12/32
  neighbor FABRIC activate
  maximum-paths 8
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor FABRIC activate
  neighbor FABRIC attribute-unchanged next-hop
 exit-address-family
exit
!
end
