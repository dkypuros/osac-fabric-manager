frr version 10.3
frr defaults datacenter
hostname leaf-2
no ipv6 forwarding
service integrated-vtysh-config
!
interface lo
 ip address 192.168.255.22/32
exit
!
interface eth1
 ip address 192.168.254.9/31
exit
!
interface eth2
 ip address 192.168.254.13/31
exit
!
interface eth3
 ip address 192.168.254.16/31
exit
!
interface eth4
 ip address 192.168.254.18/31
exit
!
router bgp 65202
 bgp router-id 192.168.255.22
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 neighbor FABRIC peer-group
 neighbor FABRIC remote-as external
 neighbor 192.168.254.8 peer-group FABRIC
 neighbor 192.168.254.12 peer-group FABRIC
 neighbor 192.168.254.17 peer-group FABRIC
 neighbor 192.168.254.19 peer-group FABRIC
 !
 address-family ipv4 unicast
  network 192.168.255.22/32
  neighbor FABRIC activate
  maximum-paths 8
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor FABRIC activate
  neighbor FABRIC attribute-unchanged next-hop
 exit-address-family
exit
!
end
