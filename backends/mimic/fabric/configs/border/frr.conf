frr version 10.3
frr defaults datacenter
hostname border
no ipv6 forwarding
service integrated-vtysh-config
!
interface lo
 ip address 192.168.255.2/32
exit
!
interface eth1
 ip address 192.168.254.1/31
exit
!
interface eth2
 ip address 192.168.254.2/31
exit
!
interface eth3
 ip address 192.168.254.4/31
exit
!
interface eth4
 ip address 10.251.0.2/24
exit
!
ip route 203.0.113.0/24 blackhole
!
router bgp 65100
 bgp router-id 192.168.255.2
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 neighbor FABRIC peer-group
 neighbor FABRIC remote-as external
 neighbor 192.168.254.0 peer-group FABRIC
 neighbor 192.168.254.3 peer-group FABRIC
 neighbor 192.168.254.5 peer-group FABRIC
 !
 address-family ipv4 unicast
  network 192.168.255.2/32
  neighbor FABRIC activate
  network 203.0.113.0/24
  maximum-paths 8
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor FABRIC activate
  advertise-all-vni
 exit-address-family
exit
!
end
