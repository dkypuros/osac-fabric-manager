frr version 10.3
frr defaults datacenter
hostname spine-1
no ipv6 forwarding
service integrated-vtysh-config
!
interface lo
 ip address 192.168.255.11/32
exit
!
interface eth1
 ip address 192.168.254.3/31
exit
!
interface eth2
 ip address 192.168.254.6/31
exit
!
interface eth3
 ip address 192.168.254.8/31
exit
!
router bgp 65200
 bgp router-id 192.168.255.11
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 neighbor FABRIC peer-group
 neighbor FABRIC remote-as external
 neighbor 192.168.254.2 peer-group FABRIC
 neighbor 192.168.254.7 peer-group FABRIC
 neighbor 192.168.254.9 peer-group FABRIC
 !
 address-family ipv4 unicast
  network 192.168.255.11/32
  neighbor FABRIC activate
  maximum-paths 8
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor FABRIC activate
  neighbor FABRIC attribute-unchanged next-hop
 exit-address-family
exit
!
end
