---
# OSAC Fabric task `delete_virtual_network` (network contract OSAC-1433 §4.10) -> DELETE VPC (204 also when already gone)
- name: Call the fabric manager
  ansible.builtin.include_tasks: _call.yaml
  vars:
    fabric_call_method: DELETE
    fabric_call_path: "/vpcs/{{ osac_job_vars.resource.id }}"
